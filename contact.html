<!DOCTYPE html>
<html lang="ja">
<head>

  gtag('config', 'G-5RF8JPF5D8');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Tsuda Shoichi</title>
<style>
  /* * Base Styling 
   * サイトのトーンに連動した静謐な黒の世界観
   */
  :root {
    --color-bg: #0a0a0a;       /* 現代美術館の暗室を思わせる、わずかにニュアンスのある深い黒 */
    --color-white: #ffffff;    /* 純白 */
    --color-text-muted: #888888; /* 静けさを邪魔しないグレー */
    --color-border: #2c2c2c;   /* 初期状態の極細の境界線 */
    --font-sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    --font-serif: "Times New Roman", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--color-bg);
    color: var(--color-white);
    font-family: var(--font-serif);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* * Layout & Container 
   */
  .contact-container {
    max-width: 680px;
    margin: 120px auto;
    padding: 0 24px;
  }

  .contact-header {
    margin-bottom: 64px;
  }

  .contact-header h2 {
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }

  .contact-header p {
    font-size: 0.9rem;
    color: var(--color-text-muted);
    font-family: var(--font-sans);
    line-height: 2;
  }

  /* * Form Elements 
   */
  .sh01-form {
    font-family: var(--font-sans);
  }

  .form-group {
    margin-bottom: 48px;
    position: relative;
  }

  .form-label {
    display: block;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }

  .required-mark {
    color: var(--color-text-muted);
    margin-left: 4px;
    font-size: 0.7rem;
  }

  /* 入力エリアのスタイリング：黒背景に溶け込む1本の線 */
  .form-input,
  .form-select,
  .form-textarea {
    width: 100%;
    background-color: transparent;
    border: none;
    border-bottom: 1px solid var(--color-border);
    border-radius: 0;
    padding: 12px 0;
    font-size: 1rem;
    color: var(--color-white);
    outline: none;
    transition: border-bottom-color 0.4s ease, border-bottom-width 0.1s ease;
    appearance: none;
    -webkit-appearance: none;
  }

  /* プレースホルダー */
  .form-input::placeholder,
  .form-textarea::placeholder {
    color: #3e3e3e;
    font-size: 0.9rem;
    font-weight: 300;
  }

  /* フォーカ支配：線が白く浮かび上がる静かな変化 */
  .form-input:focus,
  .form-select:focus,
  .form-textarea:focus {
    border-bottom: 1px solid var(--color-white);
  }

  /* セレクトボックスの矢印（白の極細ライン） */
  .select-wrapper {
    position: relative;
  }
  .select-wrapper::after {
    content: "";
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 6px;
    background-image: url('data:image/svg+xml;utf8,<svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L5 5L9 1" stroke="%23ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat: no-repeat;
    background-position: center;
    pointer-events: none;
  }

  /* セレクトボックスの選択肢（ドロップダウンメニュー）の背景色対策 */
  .form-select option {
    background-color: var(--color-bg);
    color: var(--color-white);
  }

  .form-textarea {
    resize: vertical;
    min-height: 140px;
    line-height: 1.6;
  }

  /* * Submit Button 
   * 通常時はソリッドな白背景、ホバー時に黒へと反転
   */
  .submit-btn {
    width: 100%;
    margin-top: 24px;
    padding: 20px 0;
    background-color: var(--color-white);
    color: var(--color-bg);
    border: 1px solid var(--color-white);
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    outline: none;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  .submit-btn:hover {
    background-color: var(--color-bg);
    color: var(--color-white);
  }

  /* * Responsive 
   */
  @media screen and (max-width: 768px) {
    .contact-container {
      margin: 80px auto;
    }
    .form-group {
      margin-bottom: 40px;
    }
    .contact-header h2 {
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>

<div class="contact-container">
  <div class="contact-header">
    <h2>Contact</h2>
    <p>展覧会・作品購入・取材・コラボレーション等、<br>お気軽にご連絡ください。</p>
  </div>

  <form action="https://formspree.io/f/xzdqybqk" method="POST" class="sh01-form">
    
    <div class="form-group">
      <label class="form-label" for="name">Name / お名前<span class="required-mark">*</span></label>
      <input type="text" id="name" name="name" class="form-input" required placeholder="例：津田 翔一">
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email / メールアドレス<span class="required-mark">*</span></label>
      <input type="email" id="email" name="email" class="form-input" required placeholder="例：sh012da@gmail.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="inquiry-type">Inquiry Type / お問い合わせ種別<span class="required-mark">*</span></label>
      <div class="select-wrapper">
        <select id="inquiry-type" name="inquiry_type" class="form-select" required>
          <option value="" disabled selected>選択してください</option>
          <option value="exhibition">展覧会・企画について / Exhibition & Projects</option>
          <option value="acquisition">作品の購入・コレクションについて / Artworks & Acquisition</option>
          <option value="media">取材・執筆・コラボレーションのご依頼 / Media & Editorial</option>
          <option value="other">その他のお問い合わせ / Other</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="subject">Subject / 件名</label>
      <input type="text" id="subject" name="subject" class="form-input" placeholder="ご用件の概要">
    </div>

    <div class="form-group">
      <label class="form-label" for="message">Message / メッセージ本文<span class="required-mark">*</span></label>
      <textarea id="message" name="message" class="form-textarea" required placeholder="お問い合わせ内容をご記入ください"></textarea>
    </div>

    <button type="submit" class="submit-btn">Send Message</button>
    
  </form>
</div>

</body>
</html>
