<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/jpeg" href="images/子猫4（スコティッシュフォールド）.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="津田翔一 作品シリーズ「標本美術 / Specimen Art」— 生命と死、愛着と喪失。油彩と鉛筆が交差する標本的表現の記録。">
  <meta property="og:title" content="標本美術 / Specimen Art | Tsuda Shoichi">
  <meta property="og:image" content="images/子猫#3（マンチカン）.jpg">
  <title>標本美術 / Specimen Art | Tsuda Shoichi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════
       DESIGN TOKENS
    ════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080808;
      --fg:          #ede9e4;
      --text:        #e8e4db;
      --text-muted:  rgba(232,228,219,0.55);
      --text-dim:    rgba(232,228,219,0.35);
      --border:      rgba(232,228,219,0.12);
      --border-mid:  rgba(232,228,219,0.25);
      --accent:      #cbbfb0;
      --muted-col:   #7a746e;
      --en: 'Cormorant Garamond', serif;
      --jp: 'Noto Serif JP', serif;
      --px:          clamp(20px, 5vw, 64px);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--jp);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── VIDEO BG ─── */
    .works-video-bg {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
    }
    .works-video-bg video {
      width: 100%; height: 100%; object-fit: cover; opacity: 0.05;
      display: block; filter: grayscale(100%);
    }
    .works-video-overlay {
      position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,8,8,0.85) 0%, rgba(8,8,8,0.98) 100%);
    }

    /* ─── NAV ─── */
    nav {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: clamp(14px,3vw,36px) var(--px);
      border-bottom: 0.5px solid var(--border);
      background: rgba(13,13,11,0.94); backdrop-filter: blur(8px);
    }
    .nav-logo {
      font-family: var(--en); font-size: clamp(0.7rem,2.5vw,0.9rem);
      letter-spacing: 0.3em; font-weight: 300;
      color: var(--accent); text-decoration: none;
      text-transform: uppercase;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-family: var(--en); font-size: clamp(0.55rem,1.5vw,0.72rem);
      letter-spacing: 0.25em; color: var(--muted-col);
      text-decoration: none; text-transform: uppercase;
    }
    .nav-cta {
      font-family: var(--en); font-size: clamp(0.55rem,1.5vw,0.65rem);
      letter-spacing: 0.25em; text-transform: uppercase;
      border: 0.5px solid rgba(184,168,152,0.4); padding: 0.55rem 1.4rem; color: var(--accent);
      text-decoration: none;
    }

    /* ─── HERO ─── */
    .db-hero {
      position: relative; min-height: 45vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: clamp(80px,10vh,120px) var(--px) 0;
      border-bottom: 0.5px solid var(--border);
    }
    .db-title-en {
      font-family: var(--en); font-size: clamp(2.4rem, 6vw, 4.5rem);
      font-weight: 300; letter-spacing: 0.05em; color: var(--fg);
    }
    .db-title-jp {
      font-family: var(--jp); font-weight: 200; font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.25em; color: var(--text-dim); margin-bottom: 3rem;
    }

    /* ─── ARCHIVE GRID ─── */
    .archive-section { padding: 0 var(--px) clamp(80px,12vh,160px); max-width: 1600px; margin: 0 auto; }
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 4rem 2rem;
    }

    /* ─── 個別作品カード (画像全体を表示する設定) ─── */
    .specimen-card {
      display: flex; flex-direction: column; cursor: zoom-in;
    }
    .specimen-mount {
      background: #060606;
      border: 1px solid var(--border);
      padding: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
      /* 重要：object-fit: contain で画像全体を表示 */
      width: 100%; height: 350px; 
    }
    .specimen-mount img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      filter: grayscale(60%); transition: 0.4s;
    }
    .specimen-card:hover .specimen-mount img { filter: grayscale(0%); }

    .specimen-title {
      font-family: var(--jp); font-weight: 300; font-size: 0.95rem;
      letter-spacing: 0.08em; color: var(--fg);
    }

    /* ─── LIGHTBOX ─── */
    .lb {
      position: fixed; inset: 0; z-index: 500; background: rgba(5,5,5,0.97);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out; padding: 40px;
    }
    .lb.open { display: flex; }
    .lb img { max-width: 90%; max-height: 90%; object-fit: contain; }

  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">Tsuda Shoichi</a>
  <ul class="nav-links">
    <li><a href="#">Statement</a></li>
    <li><a href="#">Works</a></li>
  </ul>
  <a href="#" class="nav-cta">Contact</a>
</nav>

<main>
  <section class="db-hero">
    <h1 class="db-title-en">Specimen Art</h1>
    <p class="db-title-jp">標本美術</p>
  </section>

  <section class="archive-section">
    <div class="archive-grid">
      
      <!-- 各作品カード -->
      <div class="specimen-card" onclick="openLB('images/ニホンリス.jpg')">
        <div class="specimen-mount"><img src="images/ニホンリス.jpg" alt="ニホンリス"></div>
        <span class="specimen-title">ニホンリス</span>
      </div>

      <div class="specimen-card" onclick="openLB('images/レッサーパンダ.jpg')">
        <div class="specimen-mount"><img src="images/レッサーパンダ.jpg" alt="レッサーパンダ"></div>
        <span class="specimen-title">レッサーパンダ#2</span>
      </div>

      <div class="specimen-card" onclick="openLB('images/兎.jpg')">
        <div class="specimen-mount"><img src="images/兎.jpg" alt="兎"></div>
        <span class="specimen-title">兎</span>
      </div>

      <div class="specimen-card" onclick="openLB('images/子猫3（マンチカン）.jpg')">
        <div class="specimen-mount"><img src="images/子猫3（マンチカン）.jpg" alt="子猫（マンチカン）"></div>
        <span class="specimen-title">子猫3（マンチカン）</span>
      </div>

      <!-- スコティッシュフォールドの追加 (参照作品として想定) -->
      <div class="specimen-card" onclick="openLB('images/子猫4（スコティッシュフォールド）.jpg')">
        <div class="specimen-mount"><img src="images/子猫4（スコティッシュフォールド）.jpg" alt="子猫（スコティッシュフォールド）"></div>
        <span class="specimen-title">スコティッシュフォールド</span>
      </div>

      <div class="specimen-card" onclick="openLB('images/カバ.jpg')">
        <div class="specimen-mount"><img src="images/カバ.jpg" alt="カバ"></div>
        <span class="specimen-title">カバ</span>
      </div>

      <div class="specimen-card" onclick="openLB('images/キャバリア・キングチャールズ・スパニエル.jpg')">
        <div class="specimen-mount"><img src="images/キャバリア・キングチャールズ・スパニエル.jpg"></div>
        <span class="specimen-title">キャバリア・キングチャールズ・スパニエル</span>
      </div>

      <div class="specimen-card" onclick="openLB('images/鷲.jpg')">
        <div class="specimen-mount"><img src="images/鷲.jpg" alt="鷲"></div>
        <span class="specimen-title">鷲</span>
      </div>

    </div>
  </section>
</main>

<div class="lb" id="lb" onclick="closeLB()">
  <img id="lb-img" src="" alt="拡大表示">
</div>

<script>
  function openLB(src) {
    document.getElementById('lb-img').src = src;
    document.getElementById('lb').classList.add('open');
  }
  function closeLB() {
    document.getElementById('lb').classList.remove('open');
  }
</script>
</body>
</html>
