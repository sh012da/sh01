  <style>
    /* ════════════════════════════════════════
       DESIGN TOKENS
    ════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080808;
      --fg:          #ede9e4;
      --text:        #e8e4db;
      --text-muted:  rgba(232,228,219,0.55);
      --text-dim:    rgba(232,228,219,0.35);
      --border:      rgba(232,228,219,0.12);
      --border-mid:  rgba(232,228,219,0.25);
      --accent:      #cbbfb0;
      --muted-col:   #7a746e;
      --en: 'Cormorant Garamond', serif;
      --jp: 'Noto Serif JP', serif;
      --px:          clamp(20px, 5vw, 64px);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--jp);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── VIDEO BG ─── */
    .works-video-bg {
      position: fixed;
      inset: 0; z-index: -1; pointer-events: none;
    }
    .works-video-bg video {
      width: 100%;
      height: 100%; object-fit: cover; opacity: 0.05;
      display: block; filter: grayscale(100%);
    }
    .works-video-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(8,8,8,0.85) 0%, rgba(8,8,8,0.98) 100%);
    }

    /* ─── NAV ─── */
    nav {
      position: sticky;
      top: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: clamp(14px,3vw,36px) var(--px);
      border-bottom: 0.5px solid var(--border);
      background: rgba(13,13,11,0.94);
      backdrop-filter: blur(8px);
    }
    .nav-logo {
      font-family: var(--en); font-size: clamp(0.7rem,2.5vw,0.9rem);
      letter-spacing: 0.3em;
      font-weight: 300;
      color: var(--accent); text-decoration: none;
      text-transform: uppercase;
    }
    .nav-cta {
      font-family: var(--en); font-size: clamp(0.55rem,1.5vw,0.65rem);
      letter-spacing: 0.25em; text-transform: uppercase;
      border: 0.5px solid rgba(184,168,152,0.4); padding: 0.55rem 1.4rem; color: var(--accent);
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }
    .nav-cta:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* ─── HERO ─── */
    .db-hero {
      position: relative;
      min-height: 45vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: clamp(80px,10vh,120px) var(--px) 40px;
      border-bottom: 0.5px solid var(--border);
    }
    .db-title-en {
      font-family: var(--en); font-size: clamp(2.4rem, 6vw, 4.5rem);
      font-weight: 300;
      letter-spacing: 0.05em; color: var(--fg);
    }
    .db-title-jp {
      font-family: var(--jp); font-weight: 200;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.25em; color: var(--text-dim); margin-bottom: 1.5rem;
    }
    .db-desc {
      font-family: var(--jp); font-weight: 200;
      font-size: 0.9rem;
      letter-spacing: 0.1em; color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 3rem;
    }

    /* ─── ARCHIVE GRID ─── */
    .archive-section { padding: 80px var(--px) clamp(80px,12vh,160px);
      max-width: 1600px; margin: 0 auto; }
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 4rem 2rem;
    }

    /* ─── 個別作品カード (画像全体を表示する設定) ─── */
    .specimen-card {
      display: flex;
      flex-direction: column; cursor: zoom-in;
    }
    .specimen-mount {
      background: #060606;
      border: 1px solid var(--border);
      padding: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
      /* 重要：object-fit: contain で画像全体を表示 */
      width: 100%; height: 350px;
    }
    .specimen-mount img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      filter: grayscale(60%);
      transition: 0.4s;
    }
    .specimen-card:hover .specimen-mount img { filter: grayscale(0%); }

    .specimen-title {
      font-family: var(--jp); font-weight: 300; font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--fg);
    }

    /* ─── CONTACT SECTION ─── */
    .contact-section {
      padding: clamp(80px, 10vh, 120px) var(--px);
      border-top: 0.5px solid var(--border);
      text-align: center;
    }
    .contact-title {
      font-family: var(--en); font-weight: 300; font-size: 2rem; 
      color: var(--accent); margin-bottom: 1rem; letter-spacing: 0.1em;
    }
    .contact-desc {
      color: var(--text-dim); margin-bottom: 2rem; font-size: 0.9rem;
    }

    /* ─── LIGHTBOX ─── */
    .lb {
      position: fixed;
      inset: 0; z-index: 500; background: rgba(5,5,5,0.97);
      display: none; align-items: center; justify-content: center;
      cursor: zoom-out; padding: 40px;
    }
    .lb.open { display: flex; }
    .lb img { max-width: 90%; max-height: 90%;
      object-fit: contain; }

  </style>
</head>
